baseURL: https://ellawallin.github.io/
title: Ella Wallin
languageCode: en-us
timeout: 300s
markup:
  goldmark:
    renderer:
      unsafe: true
caches:
  images:
    dir: :cacheDir/images
frontmatter:
  date:
    - completed
    - started
    - :default
sectionPagesMenu: main
menus:
  main:
    - name: About
      pageRef: /about
  social:
    - name: Mail
      params:
        icon: mail
      url: mailto:ella.ml.wallin@gmail.com
      weight: 1
    - name: LinkedIn
      params:
        icon: linkedin
      url: https://linkedin.com/in/ella-wallin
      weight: 2
    - name: Instagram
      params:
        icon: instagram
      url: https://instagram.com/ella.wallin
      weight: 3
